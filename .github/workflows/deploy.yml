name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the created/modified dates can fall back to git.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # This setup has no quartz.lock.json; the plugin set is determined by
      # quartz.config.yaml, so key the cache on that.
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.config.yaml', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config

      # Builds from the committed content/ only. The vault is not present on
      # the runner, so sync deliberately does not run here.
      - name: Build site
        run: npm run build:ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: pip install --quiet pyyaml

      # Le même audit qu'à l'étape 3, sur ce que la poussée a changé, et il
      # échoue sur `▲` ou `✗`. Placé avant le téléversement : un audit rouge
      # n'envoie pas d'artefact, donc le travail de déploiement ne part pas et
      # le site en ligne reste celui d'avant.
      #
      # `--since HEAD^` plutôt que `--all` : le contrôle des clés de
      # frontmatter mesure une nouveauté, ce qui n'a de sens que par rapport à
      # un état antérieur. Sur le tout premier commit, l'arbre vide de git
      # tient ce rôle — tout est alors « nouveau », et rien n'est signalé
      # comme tel puisque rien n'existait avant.
      - name: Audit the built site
        run: |
          if git rev-parse --verify --quiet HEAD^ >/dev/null; then
            since=HEAD^
          else
            since=$(git hash-object -t tree /dev/null)
          fi
          echo "Audit depuis $since"
          .claude/skills/3-site-check-local/audit.py --since "$since" --built

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
