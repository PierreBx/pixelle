# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Pixelle
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # No third-party analytics: nothing about visitors leaves the site.
  analytics: null
  locale: fr-FR
  # Must match where the site is actually served, or RSS, sitemap and
  # OG images will point at the wrong host. No protocol, no trailing slash.
  baseUrl: pierrebx.github.io/pixelle
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    # Palette « bleu nuit ». Contrast against the page background was measured
    # with the WCAG formula; every text role clears 4.5:1 in both modes.
    # Role names are Quartz's, not literal colours:
    #   light = page background      lightgray = borders and rules
    #   gray  = muted text, dates    darkgray  = body text
    #   dark  = headings             secondary = links
    #   tertiary = link hover
    colors:
      lightMode:
        light: "#fbfcfd"
        lightgray: "#d2dae2"
        gray: "#626f7c" # 5.01:1
        darkgray: "#48545f" # 7.55:1
        dark: "#1b2229" # 15.64:1
        secondary: "#2c6a9e" # 5.58:1
        tertiary: "#1f5a8a" # 7.08:1 — darker than the link, so hover reads
        highlight: rgba(44, 106, 158, 0.10)
        textHighlight: "#2c6a9e33"
      darkMode:
        light: "#0f1419"
        lightgray: "#313c47"
        gray: "#7d8b99" # 5.31:1
        darkgray: "#c3ced9" # 11.59:1
        dark: "#eef3f8" # 16.58:1
        secondary: "#6ba3d0" # 6.85:1
        tertiary: "#8fc4e8" # 9.90:1 — lighter than the link, so hover reads
        highlight: rgba(107, 163, 208, 0.13)
        textHighlight: "#6ba3d055"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  # Second line of defence. scripts/sync-vault.mjs already refuses to copy
  # anything without `publish: true`; this makes the build itself drop any
  # page lacking the flag, so a stray file in content/ cannot be emitted.
  # Do not disable.
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Quartz: https://quartz.jzhao.xyz/
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      # Toutes les propriétés du frontmatter sont affichées. Les notes de
      # odyssée/ portent l'essentiel de leur contenu là (father, spouse,
      # killed_by, home...), invisible autrement.
      #
      # Conséquence : toute nouvelle clé de frontmatter d'une note publiée
      # devient visible sans décision explicite. Passer la liste voulue dans
      # excludedProperties, ou revenir à includeAll: false et énumérer dans
      # includedProperties.
      includeAll: true
      includedProperties:
        - description
        - tags
        - aliases
      # publish/homepage : plomberie de publication, pas du contenu — ces clés
      # pilotent le script de synchronisation.
      # created/modified : déjà affichées sous le titre par content-meta, elles
      # faisaient doublon dans le tableau.
      excludedProperties:
        - publish
        - homepage
        - created
        - modified
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
